[binaries]
c = '/path/to/android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang'
cpp = '/path/to/android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++'
ar = '/path/to/android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
strip = '/path/to/android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
pkg-config = '/usr/bin/pkg-config'

[built-in options]
c_args = ['-O2', '-fPIC', '-D_FILE_OFFSET_BITS=64']
c_link_args = ['-Wl,-z,max-page-size=16384', '-Wl,-z,common-page-size=16384']
cpp_args = ['-O2', '-fPIC', '-D_FILE_OFFSET_BITS=64']
cpp_link_args = ['-Wl,-z,max-page-size=16384', '-Wl,-z,common-page-size=16384']

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'

[properties]
needs_exe_wrapper = true
